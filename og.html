<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Onest:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#101519;color:#EDF1EE;
  font-family:Onest,sans-serif;overflow:hidden;position:relative}
body::before{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(#FFFFFF0A 1px,transparent 1px),
                   linear-gradient(90deg,#FFFFFF0A 1px,transparent 1px);
  background-size:40px 40px;
  -webkit-mask-image:radial-gradient(ellipse 80% 70% at 70% 0%,#000 35%,transparent 100%)}
.wrap{position:relative;height:100%;display:grid;grid-template-columns:1fr 380px;
  gap:56px;align-items:center;padding:0 72px}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:#F0913A;margin-bottom:26px}
.eyebrow::before{content:"";width:40px;height:3px;background:#F0913A}
h1{font-family:Unbounded,sans-serif;font-weight:700;font-size:66px;line-height:1.05;
  letter-spacing:-.03em;margin-bottom:24px}
h1 span{color:#F0913A}
p{font-size:25px;color:#98A5AE;line-height:1.4;max-width:26ch}
.panel{background:#161C21;border:1px solid #232C33;border-radius:22px;padding:30px}
.cap{font-size:16px;letter-spacing:.09em;text-transform:uppercase;color:#7E8B94;margin-bottom:8px}
.big{font-family:Unbounded,sans-serif;font-weight:700;font-size:60px;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:.42em;color:#98A5AE}
.rows{margin-top:22px;display:grid;gap:1px;background:#232C33;border-radius:12px;overflow:hidden}
.rows div{background:#161C21;display:flex;justify-content:space-between;padding:13px 16px;font-size:18px}
.rows b{font-variant-numeric:tabular-nums}
.foot{position:absolute;left:72px;bottom:38px;font-size:19px;color:#6E7A83}
</style></head><body>
<div class="wrap">
  <div>
    <div class="eyebrow">Программа Ozon · с 10 сентября</div>
    <h1>Сколько пункт<br>заработает<br><span>на хранении</span></h1>
    <p>Расчёт дохода и проверка стеллажа на 120 кг по ГОСТ</p>
  </div>
  <div class="panel">
    <div class="cap">в месяц</div>
    <div class="big">10 330 <small>₽</small></div>
    <div class="rows">
      <div><span>за размещение</span><b>6 580 ₽</b></div>
      <div><span>за обработку</span><b>3 750 ₽</b></div>
      <div><span>окупаемость</span><b>2,5 мес</b></div>
    </div>
  </div>
</div>
<div class="foot">Без регистрации · считается за полминуты</div>
</body></html>
